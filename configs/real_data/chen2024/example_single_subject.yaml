    name: "Mouse 440959"
trial_filter:
  duration_tolerance_s: 0.5
  photostim: exclude
binning:
  mode: fixed_bins
  n_bins: 500
units:
  classification: good
metadata:
  trial_fields:
    start_time: start_time
    stop_time: stop_time
    photostim_onset: photostim_onset
    trial_uid: trial_uid
regions: {}
