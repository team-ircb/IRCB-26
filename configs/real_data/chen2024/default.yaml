# Download separately or point input_dir at existing NWB files.
input_dir: raw
output_dir: processed

subjects: []  # Empty = keep all subjects in input_dir. Add [{id, name}] to restrict.
# Single-subject variant:
# subjects:
#   - id: "440959"
#     name: "Mouse 440959"
# input_dir: raw/sub-440959

trial_filter:
  duration_tolerance_s: 0.5  # Duration must be within 5.0 +/- tolerance seconds.
  photostim: exclude  # exclude | include | only (set include for photostim analyses)

binning:
  mode: fixed_bins
  n_bins: 500  # Adjustable; physical bin width = each trial duration / n_bins

units:
  classification: good  # Set null to keep all classifications

metadata:
  trial_fields:
    start_time: start_time
    stop_time: stop_time
    photostim_onset: photostim_onset
    photostim_duration: photostim_duration
    trial_uid: trial_uid
    outcome: outcome
    trial_instruction: trial_instruction  # DANDI 000363 has no trial_type column

# Unit labels: Allen CCF abbreviation (default, as in the original extraction) or the full anno_name.
region_labels: abbreviation

# Empty mapping keeps every area as its own area-* dataset (one per abbreviation).
regions: {}
